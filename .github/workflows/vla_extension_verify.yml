name: VLA Handover Feasibility Extension Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify-vla-offline-reproducibility:
    name: Verify VLA Extension (Offline Evaluation & Provenance Audit)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install lightweight offline evaluation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run VLA extension unit & integration tests
        run: |
          pytest extensions/vla_handover_feasibility/tests -v

      - name: Run cryptographic provenance & consistency audit
        run: |
          python -m extensions.vla_handover_feasibility.provenance_audit

      - name: Run one-command offline demo (recompute C1-C10, 1,011 R3B rows & regenerate dashboard)
        run: |
          python -m extensions.vla_handover_feasibility.demo --no-open

      - name: Verify dashboard, evaluation artifacts, RQ1/RQ2 outputs, and README screenshot links
        run: |
          test -s extensions/vla_handover_feasibility/artifacts/report/index.html
          test -s extensions/vla_handover_feasibility/artifacts/evaluation_summary.json
          test -s extensions/vla_handover_feasibility/artifacts/counterfactual_comparison.csv
          test -s extensions/vla_handover_feasibility/artifacts/extension_claim_register.csv
          test -s extensions/vla_handover_feasibility/artifacts/ablation_scene_05_signed_accel.json
          test -s extensions/vla_handover_feasibility/artifacts/command_sensitivity/scene_02_keep_forward.json
          test -s extensions/vla_handover_feasibility/artifacts/command_sensitivity/scene_06_keep_forward.json
          test -s extensions/vla_handover_feasibility/artifacts/command_sensitivity/comparison.csv
          test -s extensions/vla_handover_feasibility/artifacts/command_sensitivity/summary.json
          test -s extensions/vla_handover_feasibility/artifacts/c10_robustness/c10_robustness_matrix.csv
          test -s extensions/vla_handover_feasibility/artifacts/c10_robustness/c10_robustness_summary.json
          test -s extensions/vla_handover_feasibility/artifacts/report/screenshots/01_executive_findings_and_overview.png
          test -s extensions/vla_handover_feasibility/artifacts/report/screenshots/02_scene_05_braking_violation_and_ablation.png
          test -s extensions/vla_handover_feasibility/artifacts/report/screenshots/03_scene_03_urban_lead_r3b_handover.png
          test -s extensions/vla_handover_feasibility/artifacts/report/screenshots/04_scene_01_counterfactual_d0_provenance.png
