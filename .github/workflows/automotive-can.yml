name: Automotive CAN integration
on:
  push:
  pull_request:
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install \
            numpy==2.4.6 \
            scipy==1.17.1 \
            pandas==3.1.1 \
            sympy==1.14.0 \
            matplotlib==3.11.1 \
            pillow==12.3.0 \
            fonttools==4.65.0 \
            contourpy==1.3.3 \
            kiwisolver==1.5.1 \
            cycler==0.12.1 \
            pyparsing==3.3.2 \
            pytest==9.2.0 \
            jsonschema==4.26.0
      - name: Native C++ build and tests
        run: cmake -S automotive_can -B build/automotive_can && cmake --build build/automotive_can --parallel && ctest --test-dir build/automotive_can --output-on-failure
      - name: Python regression suite
        run: python -m pytest
