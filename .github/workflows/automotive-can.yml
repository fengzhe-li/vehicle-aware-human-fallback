name: Automotive CAN integration
on:
  push:
  pull_request:
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research dependencies
        run: python -m pip install -r requirements.txt
      - name: Native C++ build and tests
        run: cmake -S automotive_can -B build/automotive_can && cmake --build build/automotive_can --parallel && ctest --test-dir build/automotive_can --output-on-failure
      - name: Python regression suite
        run: python -m pytest
